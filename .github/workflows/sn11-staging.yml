name: SN-11 staging native red-green and regression
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/sn11-weak-layer
          fetch-depth: 3
      - name: Build pinned MeteoIO
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake numdiff
          git clone --no-checkout https://code.wsl.ch/snow-models/meteoio.git /tmp/meteoio
          git -C /tmp/meteoio checkout --detach 857dd8055861305a20b8bde29914dee7e4c69f2f
          cd /tmp/meteoio
          cmake -S . -B . -DDEST=safe -DVERSION_FROM_GIT=ON -DBUILD_TESTING=OFF -DUSE_LTO_OPTIMIZATIONS=OFF -DINSTALL_DOC=OFF -DCPACK_BUNDLE_ALL=ON -DCPACK_GENERATOR=DEB
          cmake --build . -j2
          cpack
          sudo dpkg -i MeteoIO-*.deb
      - name: Verify exact staging commit boundaries
        run: |
          git log -3 --oneline
          git diff --check HEAD~2 HEAD
          test "$(git diff --name-only HEAD~2 HEAD~1)" = snowpack/Stability.cc
          test "$(git diff --name-only HEAD~1 HEAD | grep -vc '^tests/')" = 0
      - name: Build regression test against unmodified implementation
        run: |
          git restore --source=HEAD~2 -- snowpack/Stability.cc
          cmake -S . -B build -DDEST=safe -DVERSION_FROM_GIT=OFF -DBUILD_TESTING=ON -DMETEOIO_INCLUDE_DIR=/usr/include -DMETEOIO_LIBRARY=/usr/lib/libmeteoio.so
          cmake --build build -j2
          mkdir -p replay tests/res1exp/output tests/res5exp/output
          cp -a tests/. build/tests/
          ln -sfn "$PWD/bin" build/bin
          ln -sfn "$PWD/tools" build/tools
          find build/tests -name '*.sh' -exec chmod +x {} +
          chmod +x tools/*.sh
          set +e
          ctest --test-dir build -R '^stability.smoke$' -V > replay/red.txt 2>&1
          rc=$?
          set -e
          cat replay/red.txt
          test "$rc" -ne 0
          grep -q 'Wrong weak layer:' replay/red.txt
      - name: Run baseline official suite
        run: |
          set +e
          ctest --test-dir build -E '^stability.smoke$' --output-on-failure > replay/baseline.txt 2>&1
          echo $? > replay/baseline.rc
          set -e
          tail -25 replay/baseline.txt
      - name: Restore candidate and run native test
        run: |
          git restore --source=HEAD -- snowpack/Stability.cc
          cmake --build build -j2
          ctest --test-dir build -R '^stability.smoke$' -V | tee replay/green.txt
      - name: Run candidate official suite
        run: |
          set +e
          ctest --test-dir build -E '^stability.smoke$' --output-on-failure > replay/candidate.txt 2>&1
          echo $? > replay/candidate.rc
          set -e
          tail -25 replay/candidate.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          def results(p):
              return dict(re.findall(r'Test\s+#\d+:\s+(\S+)\s+\.+\s+(Passed|\*\*\*Failed|\*\*\*Not Run|\*\*\*Exception)', Path(p).read_text()))
          a,b=results('replay/baseline.txt'),results('replay/candidate.txt')
          print('baseline:',a)
          print('candidate:',b)
          assert len(a)==len(b)==9, (a,b)
          assert all(b[k]=='Passed' for k in a if a[k]=='Passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn11-staging-verification
          path: replay/
