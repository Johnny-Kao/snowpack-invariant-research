name: SN-11 native weak-layer selection probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned MeteoIO
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake numdiff
          git clone --no-checkout https://code.wsl.ch/snow-models/meteoio.git /tmp/meteoio
          git -C /tmp/meteoio checkout --detach 857dd8055861305a20b8bde29914dee7e4c69f2f
          cd /tmp/meteoio
          cmake -S . -B . -DDEST=safe -DVERSION_FROM_GIT=ON -DBUILD_TESTING=OFF -DUSE_LTO_OPTIMIZATIONS=OFF -DINSTALL_DOC=OFF -DCPACK_BUNDLE_ALL=ON -DCPACK_GENERATOR=DEB
          cmake --build . -j2
          cpack
          sudo dpkg -i MeteoIO-*.deb
      - name: Build Snowpack with research-only selector access
        run: |
          python3 -c 'from pathlib import Path; p=Path("snowpack/Stability.h"); s=p.read_text(); assert s.count("private:")==1; p.write_text(s.replace("private:", "public:", 1))'
          cmake -S . -B build -DDEST=safe -DVERSION_FROM_GIT=OFF -DBUILD_TESTING=ON -DMETEOIO_INCLUDE_DIR=/usr/include -DMETEOIO_LIBRARY=/usr/lib/libmeteoio.so
          cmake --build build --target snowpack -j2
          g++ -std=c++17 -I. research/sn11/native_weak_layer.cc -Llib -Wl,-rpath,"$PWD/lib" -lsnowpack -lmeteoio -o /tmp/sn11
      - name: Run native baseline against independent depth-window oracle
        run: |
          set +e
          /tmp/sn11
          rc=$?
          set -e
          test "$rc" -eq 2
